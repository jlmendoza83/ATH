<style>
/* Layout: whitewashed villa page — full-bleed aerial hero, fact strip, gallery grid, story, location, enquiry */
:root{
  --bg:#fbfbf8; --surface:#ffffff; --fg:#1d2430; --muted:#5b6474; --line:#e3e5e2;
  --accent:#1f4f8a; --accent-ink:#ffffff; --ochre:#b9822f;
  --display:"Bodoni Moda", "Didot", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#171e27; --fg:#eef1f4; --muted:#a3adba; --line:#2a3340;
  --accent:#7fb0ea; --accent-ink:#0c1520; --ochre:#e0ac5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#171e27; --fg:#eef1f4; --muted:#a3adba; --line:#2a3340;
  --accent:#7fb0ea; --accent-ink:#0c1520; --ochre:#e0ac5c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px}
.brand-wrap{display:flex;align-items:center;gap:14px;min-width:0}
.hr-logo{display:inline-flex;background:#fff;padding:4px 8px;border-radius:4px}
.hr-logo img{display:block;height:34px;width:auto}
.brand{font-family:var(--display);font-size:1.15rem;letter-spacing:.02em}
.lang{display:flex;gap:4px;flex-wrap:wrap}
.lang button{font:600 .75rem var(--body);letter-spacing:.08em;border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 9px;border-radius:4px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lang button:focus-visible,.btn:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.hero{position:relative;border-radius:6px;overflow:hidden}
.hero img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;max-width:100%}
.hero-text{padding-block:28px 8px}
.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5.4vw,3.6rem);line-height:1.08;margin:.3em 0 .25em;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,3.4vw,2.2rem);margin:0 0 .5em;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;font-size:1.08rem;margin:0}
.price{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:18px}
.price strong{font-family:var(--display);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:12px 20px;border-radius:4px;border:0;cursor:pointer;font-size:.95rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-block:32px}
.fact{padding:16px 12px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:400;font-variant-numeric:tabular-nums}
.fact span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
section{padding-block:28px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gallery img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block;aspect-ratio:3/2;max-width:100%}
.gallery .wide{grid-column:span 2}
@media (max-width:700px){.gallery{grid-template-columns:repeat(2,1fr)}}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:40px}
.cols>*{min-width:0}
@media (max-width:760px){.cols{grid-template-columns:1fr;gap:16px}}
.levels{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.levels li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.levels li>*{min-width:0}
.levels .lv{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);font-weight:600;padding-top:3px}
.feat{columns:2;column-gap:28px;padding-left:18px;margin:0}
.feat li{break-inside:avoid;margin-bottom:6px}
@media (max-width:480px){.feat{columns:1}}
table.dist{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.dist td{padding:9px 0;border-bottom:1px solid var(--line)}
table.dist td:last-child{text-align:right;font-weight:600}
.enquiry{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px}
.enq-logo img{height:44px;width:auto;background:#fff;padding:6px 10px;border-radius:4px}
.contact-line{font-size:1.1rem;font-weight:600;user-select:all}
footer{color:var(--muted);font-size:.8rem;padding-block:28px 40px}
@media (prefers-reduced-motion:no-preference){.hero img{animation:settle 1.4s ease-out both}@keyframes settle{from{transform:scale(1.03)}to{transform:none}}}
</style></head><body>

}
